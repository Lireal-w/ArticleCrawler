<!-- path: static/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>定时任务管理</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">定时任务调度面板</h2>
    <div class="row justify-content-center">
        <!-- 爬虫任务卡片 -->
        <div class="col-md-5 mb-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">爬虫任务 (run_spider)</div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text">时 : 分</span>
                        <input type="number" id="run_spider_hour" class="form-control" min="0" max="23">
                        <input type="number" id="run_spider_minute" class="form-control" min="0" max="59">
                    </div>
                    <button class="btn btn-primary w-100" onclick="updateJob('run_spider')">更新时间</button>
                </div>
            </div>
        </div>
        <!-- 清理任务卡片 -->
        <div class="col-md-5 mb-3">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">清理任务 (clean_empty_json_files)</div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text">时 : 分</span>
                        <input type="number" id="clean_empty_json_files_hour" class="form-control" min="0" max="23">
                        <input type="number" id="clean_empty_json_files_minute" class="form-control" min="0" max="59">
                    </div>
                    <button class="btn btn-success w-100" onclick="updateJob('clean_empty_json_files')">更新时间</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- jQuery & Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const jobs = ["run_spider", "clean_empty_json_files"];

    // 页面加载时获取当前执行时间
    function loadSchedules() {
        jobs.forEach(job => {
            $.get(`/schedule/${job}`, function(data) {
                $(`#${job}_hour`).val(data.hour);
                $(`#${job}_minute`).val(data.minute);
            });
        });
    }

    // 提交修改后的执行时间
    function updateJob(job) {
        const hour = parseInt($(`#${job}_hour`).val());
        const minute = parseInt($(`#${job}_minute`).val());
        
        $.ajax({
            url: `/schedule/${job}`,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify({ hour: hour, minute: minute }),
            success: function(res) {
                alert(res.message);
                loadSchedules(); // 刷新确认
            },
            error: function(err) {
                alert("更新失败: " + (err.responseJSON?.error || '未知错误'));
            }
        });
    }

    $(document).ready(function() {
        loadSchedules();
    });
</script>
</body>
</html>
